name: Bug report / 버그 제보
description: Something is broken or behaves unexpectedly. / 동작이 이상하거나 고장 났어요.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste prompts, code, API keys, or personal information. Issues are public.
        프롬프트·코드·키·개인정보는 올리지 마세요. 이슈는 공개됩니다.
  - type: textarea
    id: what
    attributes:
      label: What happened? / 무슨 일이 있었나요?
      description: What you did, what you expected, and what happened instead. / 무엇을 했고, 무엇을 기대했고, 실제로 어떻게 됐는지.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics / 진단 정보
      description: Menu → Copy diagnostics, then paste here. / 메뉴 → 진단 정보 복사 후 붙여 넣기.
      render: text
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: AI tool / AI 도구
      multiple: true
      options: [Codex, Claude Code, Cursor, Gemini CLI, None / 없음, Other / 기타]
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or anything else / 스크린샷이나 기타
